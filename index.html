<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latein · Vokabeltrainer</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;1,8..60,300;1,8..60,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <section id="start-screen" class="start-screen">
    <div class="start-card">
      <p class="start-kicker">Latein Vokabeltrainer</p>
      <h1>Wähle deinen Kurs</h1>

      <details class="course-menu" id="course-9c-wrap">
        <summary class="menu-btn menu-btn-main menu-summary" id="btn-course-9c">Latein-9c</summary>
        <div class="submenu" id="course-9c">
          <details class="submenu-group" id="grammar-9c-wrap">
            <summary class="menu-btn menu-btn-sub menu-btn-group">Grammatik</summary>
            <div class="submenu-nested">
              <button type="button" class="menu-btn menu-btn-sub" data-course="Latein-9c" data-lesson="velle, nolle, malle – Formenübung" onclick="openLessonFromMenu('Latein-9c','velle, nolle, malle – Formenübung')">velle, nolle, malle – Formenübung</button>
              <button type="button" class="menu-btn menu-btn-sub" data-course="Latein-9c" data-lesson="ire – Formen &amp; Komposita" onclick="openLessonFromMenu('Latein-9c','ire – Formen &amp; Komposita')">ire – Formen &amp; Komposita</button>
              <button type="button" class="menu-btn menu-btn-sub" data-course="Latein-9c" data-lesson="ipse &amp; idem – Formen und Übungen" onclick="openLessonFromMenu('Latein-9c','ipse &amp; idem – Formen und Übungen')">ipse &amp; idem – Formen und Übungen</button>
            </div>
          </details>
          <details class="submenu-group" id="vocab-9c-wrap">
            <summary class="menu-btn menu-btn-sub menu-btn-group">Vokabeln</summary>
            <div class="submenu-nested">
              <button type="button" class="menu-btn menu-btn-sub" data-course="Latein-9c" data-lesson="Lektion 15" onclick="openLessonFromMenu('Latein-9c','Lektion 15')">Lektion 15</button>
              <button type="button" class="menu-btn menu-btn-sub" data-course="Latein-9c" data-lesson="Lektion 40" onclick="openLessonFromMenu('Latein-9c','Lektion 40')">Lektion 40</button>
              <button type="button" class="menu-btn menu-btn-sub" data-course="Latein-9c" data-lesson="Lektion 41" onclick="openLessonFromMenu('Latein-9c','Lektion 41')">Lektion 41</button>
              <button type="button" class="menu-btn menu-btn-sub" data-course="Latein-9c" data-lesson="Lektion 42" onclick="openLessonFromMenu('Latein-9c','Lektion 42')">Lektion 42</button>
              <button type="button" class="menu-btn menu-btn-sub" data-course="Latein-9c" data-lesson="Lektion 43" onclick="openLessonFromMenu('Latein-9c','Lektion 43')">Lektion 43</button>
            </div>
          </details>
        </div>
      </details>

      <details class="course-menu" id="course-8c-wrap">
        <summary class="menu-btn menu-btn-main menu-summary" id="btn-course-8c">Latein-8c</summary>
        <div class="submenu" id="course-8c">
          <button type="button" class="menu-btn menu-btn-sub" data-course="Latein-8c" data-lesson="Stammformen bekannter Vokabeln" onclick="openLessonFromMenu('Latein-8c','Stammformen bekannter Vokabeln')">Stammformen bekannter Vokabeln</button>
          <button type="button" class="menu-btn menu-btn-sub" data-course="Latein-8c" data-lesson="Lektion 18" onclick="openLessonFromMenu('Latein-8c','Lektion 18')">Lektion 18</button>
        </div>
      </details>
    </div>
  </section>

  <script>
    function openLessonFromMenu(course, lesson) {
      let quizFile = 'quiz.html';
      if(course === 'Latein-8c') {
        if(lesson === 'Lektion 18') {
          quizFile = 'quiz-8c-L18.html';
        } else {
          quizFile = 'quiz-8c.html';
        }
      } else if(course === 'Latein-9c' && lesson === 'Lektion 15') {
        quizFile = 'quiz-9c-L15.html';
      } else if(course === 'Latein-9c' && lesson === 'Lektion 40') {
        quizFile = 'quiz-9c-L40.html';
      } else if(lesson === 'velle, nolle, malle – Formenübung') {
        window.location.href = './lessons/verben-irregularia.html'; return;
      } else if(lesson === 'ire – Formen & Komposita') {
        window.location.href = './lessons/verb-ire.html'; return;
      } else if(lesson === 'ipse & idem – Formen und Übungen') {
        window.location.href = './lessons/pronomina-ipse-idem.html'; return;
      }
      window.location.href = `./lessons/${quizFile}?course=${encodeURIComponent(course)}&lesson=${encodeURIComponent(lesson)}`;
    }
  </script>
</body>
</html>
