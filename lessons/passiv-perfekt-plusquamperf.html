<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latein · Perfekt &amp; Plusquamperf. Passiv</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;1,8..60,300;1,8..60,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<style>
.verb-page { max-width: 700px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
.verb-page-header { margin-bottom: 2rem; padding-bottom: 1.2rem; border-bottom: 1px solid var(--border); }
.verb-page-header h2 { font-family: 'Playfair Display', serif; font-size: 1.9rem; font-weight: 700; color: var(--ink); line-height: 1.15; }
.verb-page-header h2 em { font-style: italic; color: var(--gold); }
.verb-page-header p { font-size: 0.9rem; color: var(--ink3); margin-top: 3px; margin-bottom: 0; font-family: 'DM Mono', monospace; text-transform: uppercase; letter-spacing: 0.08em; }

/* Tempus tabs */
.verb-tabs { display: flex; gap: 0; border: 1px solid var(--border2); border-radius: var(--radius); overflow: hidden; margin-bottom: 1.2rem; background: var(--surface2); }
.verb-tab { flex: 1; padding: 10px 0; font-family: 'Source Serif 4', serif; font-size: 1rem; font-style: italic; font-weight: 400; background: none; border: none; cursor: pointer; color: var(--ink3); transition: all 0.15s; letter-spacing: 0.02em; }
.verb-tab:not(:last-child) { border-right: 1px solid var(--border2); }
.verb-tab.active { background: var(--ink); color: var(--bg); }
.verb-tab:hover:not(.active) { background: var(--border); color: var(--ink); }
.verb-tab.done:not(.active) { color: var(--green); }
.verb-tab.done .vtcheck { font-style: normal; color: var(--green); margin-right: 3px; }
.verb-tab.done.active .vtcheck { color: var(--gold2); }

/* Stufen */
.stufen-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 1.8rem; }
.stufe-btn { padding: 10px 4px; font-family: 'DM Mono', monospace; font-size: 0.68rem; background: none; border: 1px solid var(--border2); border-radius: var(--radius); cursor: pointer; color: var(--ink3); transition: all 0.15s; text-align: center; line-height: 1.4; letter-spacing: 0.03em; text-transform: uppercase; }
.stufe-btn .snum { display: block; font-size: 1.3rem; font-family: 'Playfair Display', serif; color: var(--ink2); margin-bottom: 3px; font-weight: 700; }
.stufe-btn.active { border-color: var(--ink); background: var(--ink); color: #e8dcc8; }
.stufe-btn.active .snum { color: var(--gold2); }
.stufe-btn.done { border-color: var(--green); }
.stufe-btn.done .snum { color: var(--green); }
.stufe-btn:hover:not(.active) { border-color: var(--ink3); color: var(--ink2); }

/* Content area */
.verb-content { border: 1px solid var(--border2); border-radius: var(--radius); background: var(--surface); min-height: 300px; padding: 1.5rem; box-shadow: var(--shadow); }

/* Paradigm table (view) */
.verb-table { width: 100%; border-collapse: collapse; }
.verb-table caption { font-family: 'Playfair Display', serif; font-style: italic; font-size: 1.1rem; color: var(--ink2); margin-bottom: 10px; caption-side: top; text-align: left; }
.verb-table th { font-family: 'DM Mono', monospace; font-size: 0.67rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink3); padding: 6px 12px; border-bottom: 1px solid var(--border); text-align: left; font-weight: 400; }
.verb-table td { padding: 9px 12px; border-bottom: 1px solid var(--border); font-size: 1rem; vertical-align: middle; }
.verb-table td:first-child { color: var(--ink3); font-size: 0.82rem; font-family: 'DM Mono', monospace; width: 80px; }
.verb-table td.ppp-cell { font-style: italic; color: var(--ink2); }
.verb-table td.esse-cell { font-weight: 700; color: var(--gold); }
.verb-table td.full-cell { font-weight: 600; }
.verb-table tr:last-child td { border-bottom: none; }

/* Schema box */
.schema-box { background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--radius); padding: 0.9rem 1.1rem; margin-bottom: 1.3rem; }
.schema-box .schema-label { font-family: 'DM Mono', monospace; font-size: 0.67rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink3); margin-bottom: 7px; }
.schema-rule { font-family: 'Source Serif 4', serif; font-size: 1.05rem; color: var(--ink); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
.schema-rule .part-ppp { font-style: italic; color: var(--ink2); font-weight: 600; }
.schema-rule .part-op { color: var(--ink3); }
.schema-rule .part-esse { color: var(--gold); font-weight: 700; }
.schema-sub { font-size: 0.82rem; color: var(--ink3); font-style: italic; font-family: 'Source Serif 4', serif; margin: 0; }

/* Timer */
.timer-wrap { margin-bottom: 14px; }
.timer-label { font-family: 'DM Mono', monospace; font-size: 0.72rem; color: var(--ink3); margin-bottom: 6px; display: flex; justify-content: space-between; }
.timer-track { height: 3px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
.timer-fill { height: 100%; width: 100%; background: linear-gradient(90deg, var(--gold), var(--gold2)); border-radius: 99px; transition: width 0.1s linear; }

/* Drag and drop */
.drag-pool { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; min-height: 44px; padding: 10px; border: 1.5px dashed var(--border2); border-radius: var(--radius); background: var(--bg); }
.drag-chip { padding: 5px 14px; background: var(--surface); border: 1.5px solid var(--border2); border-radius: 99px; cursor: grab; font-family: 'Source Serif 4', serif; font-size: 1rem; font-weight: 600; color: var(--ink); user-select: none; transition: all 0.13s; }
.drag-chip:hover { border-color: var(--gold); background: #fffdf5; }
.drag-chip.dragging { opacity: 0.35; }
.drag-chip.correct { background: #edf7ed; border-color: var(--green); color: var(--green); cursor: default; }
.drag-chip.wrong { background: #fdf0ee; border-color: var(--red); color: var(--red); }

.drop-table { width: 100%; border-collapse: collapse; }
.drop-table th { font-family: 'DM Mono', monospace; font-size: 0.67rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink3); padding: 6px 10px; border-bottom: 1px solid var(--border); text-align: left; font-weight: 400; }
.drop-table td { padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.drop-table td:first-child { font-family: 'DM Mono', monospace; font-size: 0.8rem; color: var(--ink3); width: 70px; }
.drop-table td.ppp-col { font-family: 'Source Serif 4', serif; font-size: 1rem; font-style: italic; color: var(--ink2); width: 110px; }
.drop-table tr:last-child td { border-bottom: none; }
.drop-zone { min-width: 100px; min-height: 34px; border: 1.5px dashed var(--border2); border-radius: var(--radius); padding: 4px 10px; display: inline-flex; align-items: center; font-family: 'Source Serif 4', serif; font-size: 1rem; font-weight: 600; transition: all 0.13s; color: var(--ink3); }
.drop-zone.over { border-color: var(--gold); background: #fffdf5; }
.drop-zone.filled { border-style: solid; border-color: var(--border2); color: var(--ink); }
.drop-zone.correct { border-color: var(--green); background: #edf7ed; color: var(--green); }
.drop-zone.wrong { border-color: var(--red); background: #fdf0ee; color: var(--red); }

/* Input mode */
.input-table { width: 100%; border-collapse: collapse; }
.input-table th { font-family: 'DM Mono', monospace; font-size: 0.67rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink3); padding: 6px 10px; border-bottom: 1px solid var(--border); text-align: left; font-weight: 400; }
.input-table td { padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.input-table td:first-child { font-family: 'DM Mono', monospace; font-size: 0.8rem; color: var(--ink3); width: 70px; }
.input-table td.ppp-col { font-family: 'Source Serif 4', serif; font-size: 1rem; font-style: italic; color: var(--ink2); width: 110px; }
.input-table tr:last-child td { border-bottom: none; }
.input-table input { font-family: 'Source Serif 4', serif; font-size: 1rem; font-weight: 600; border: 1.5px solid var(--border2); border-radius: 8px; padding: 6px 10px; background: var(--surface2); color: var(--ink); width: 140px; outline: none; transition: border-color 0.13s; }
.input-table input:focus { border-color: var(--gold); background: var(--surface); }
.input-table input.correct { border-color: var(--green); background: #edf7ed; color: var(--green); }
.input-table input.wrong { border-color: var(--red); background: #fdf0ee; color: var(--red); }
.input-table .hint { font-size: 0.82rem; color: var(--red); margin-left: 8px; font-style: italic; font-family: 'Source Serif 4', serif; }

/* Actions & buttons */
.verb-actions { display: flex; gap: 8px; margin-top: 16px; align-items: center; flex-wrap: wrap; }
.vbtn { display: inline-flex; align-items: center; gap: 6px; padding: 0.6rem 1.2rem; border-radius: 8px; font-family: 'Source Serif 4', serif; font-size: 14px; cursor: pointer; border: 1.5px solid transparent; transition: all 0.13s; }
.vbtn-primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.vbtn-primary:hover { background: #2e2820; }
.vbtn-ghost { background: var(--surface); color: var(--ink2); border-color: var(--border2); }
.vbtn-ghost:hover { border-color: var(--ink3); background: var(--surface2); color: var(--ink); }
.vbtn-gold { background: var(--gold); border-color: var(--gold); color: #fff; }
.vbtn-gold:hover { background: #b8962e; }
.vbtn-red { background: var(--red); border-color: var(--red); color: #fff; }
.vbtn-red:hover { background: var(--red2); }

/* Feedback */
.verb-feedback { display: flex; align-items: center; gap: 10px; margin-top: 14px; padding: 10px 14px; border-radius: var(--radius); font-size: 0.9rem; }
.verb-feedback.ok { background: #edf7ed; border: 1px solid #aad4a7; color: var(--green); }
.verb-feedback.err { background: #fdf0ee; border: 1px solid #f0b8ad; color: var(--red); }
.verb-score { font-family: 'DM Mono', monospace; font-size: 0.78rem; margin-left: auto; padding: 3px 10px; border-radius: 99px; background: rgba(0,0,0,0.07); }

/* Task box */
.task-box { background: #fdf8ec; border: 1px solid rgba(196,154,42,0.35); border-left: 3px solid var(--gold); border-radius: var(--radius); padding: 0.85rem 1.1rem; margin-bottom: 1.4rem; }
.task-box .task-label { font-family: 'DM Mono', monospace; font-size: 0.67rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--gold); margin-bottom: 5px; }
.task-box .task-text { font-family: 'Source Serif 4', serif; font-size: 1rem; color: var(--ink); line-height: 1.55; margin: 0; }
.task-box .task-text strong { font-weight: 600; color: var(--ink); }

/* Win screen */
.win-screen { text-align: center; padding: 3rem 1rem; }
.win-stars { font-size: 3rem; letter-spacing: 0.1em; margin-bottom: 1rem; }
.win-screen h2 { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 700; font-style: italic; color: var(--gold); margin-bottom: 0.4rem; }
.win-screen p { color: var(--ink2); font-size: 1rem; margin-bottom: 1.5rem; }

@media (max-width: 600px) {
  .verb-page { padding: 1.2rem 1rem 3rem; }
  .input-table input { width: 110px; }
}
</style>
</head>
<body>
<canvas id="confetti-canvas" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999;"></canvas>

<div class="shell" id="app-shell">
  <div class="topbar">
    <div class="topbar-title">
      <span class="dot"></span>
      Latein
      <span class="topbar-sub">Passiv · Perfekt &amp; Plusquamperf.</span>
    </div>
    <button class="vbtn vbtn-ghost" onclick="location.href='../index.html'" style="margin-left:12px;padding:0.45rem 0.9rem;font-size:13px;color:#e8dcc8;border-color:rgba(255,255,255,0.2);background:rgba(255,255,255,0.08);">← zurück</button>
  </div>

  <div style="flex:1;overflow-y:auto;">
    <div class="verb-page">
      <div class="verb-page-header">
        <h2>Passiv: <em>Perfekt</em> &amp; <em>Plusquamperf.</em></h2>
        <p>Bildung &amp; Formenübung · laudare als Beispielverb</p>
      </div>

      <div class="verb-tabs" id="tempusTabs"></div>
      <div class="stufen-row" id="stufenRow"></div>
      <div class="verb-content" id="content"></div>
    </div>
  </div>
</div>

<script>
/* ── DATA ── */
const TEMPORA = ["Perfekt Passiv", "Plusquamperf. Pass."];
const PERSONS = ["1. Sg.", "2. Sg.", "3. Sg.", "1. Pl.", "2. Pl.", "3. Pl."];

const ESSE_FORMS = {
  "Perfekt Passiv":      ["sum", "es", "est", "sumus", "estis", "sunt"],
  "Plusquamperf. Pass.": ["eram", "eras", "erat", "eramus", "eratis", "erant"]
};

const PPP_SG = "laudatus";
const PPP_PL = "laudati";

/* ── STATE ── */
let temp = "Perfekt Passiv";
let stufe = 1;
let timerInterval = null;
let doneMap = {};
let draggedChip = null;
let dropZoneData = {};

/* ── HELPERS ── */
function doneKey()     { return temp + "_" + stufe; }
function isTempDone(t) { return [1,2,3,4,5].every(s => doneMap[t + "_" + s]); }
function isAllDone()   { return TEMPORA.every(t => isTempDone(t)); }
function getPPP(i)     { return i < 3 ? PPP_SG : PPP_PL; }
function getRows()     { return PERSONS.map((p, i) => [p, getPPP(i), ESSE_FORMS[temp][i]]); }

function getFakes() {
  const other = temp === "Perfekt Passiv" ? "Plusquamperf. Pass." : "Perfekt Passiv";
  return ESSE_FORMS[other];
}

function shuffle(arr) { return arr.sort(() => Math.random() - 0.5); }

/* ── BUILD UI ── */
function buildTabs() {
  document.getElementById('tempusTabs').innerHTML = TEMPORA.map(t => {
    const done = isTempDone(t);
    const active = t === temp;
    const check = done ? `<span class="vtcheck">✓</span>` : '';
    return `<button class="verb-tab${active ? ' active' : ''}${done ? ' done' : ''}" onclick="setTemp('${t}')">${check}${t}</button>`;
  }).join('');
}

const STUFE_LABELS = ["Tabelle", "10s + D&D", "D&D blind", "10s + Eingabe", "Eingabe blind"];
function buildStufen() {
  document.getElementById('stufenRow').innerHTML = [1,2,3,4,5].map(i => {
    const key = temp + "_" + i;
    const done = doneMap[key];
    const active = i === stufe;
    return `<button class="stufe-btn${active ? ' active' : ''}${done ? ' done' : ''}" onclick="setStufe(${i})">
      <span class="snum">${done && !active ? '✓' : i}</span>${STUFE_LABELS[i-1]}
    </button>`;
  }).join('');
}

function setTemp(t)  { clearTimer(); temp = t; buildTabs(); buildStufen(); render(); }
function setStufe(s) { clearTimer(); stufe = s; buildStufen(); render(); }

/* ── RENDER DISPATCHER ── */
function render() {
  clearTimer();
  const c = document.getElementById('content');
  c.innerHTML = '';
  if      (stufe === 1) renderView(c);
  else if (stufe === 2) renderCountdownThenDrag(c);
  else if (stufe === 3) renderDrag(c);
  else if (stufe === 4) renderCountdownThenInput(c);
  else                  renderInput(c);
}

/* ── SHARED: SCHEMA BOX ── */
function schemaHTML() {
  const isPerf = temp === "Perfekt Passiv";
  const esseForms = isPerf
    ? "sum · es · est · sumus · estis · sunt"
    : "eram · eras · erat · eramus · eratis · erant";
  return `
    <div class="schema-box">
      <div class="schema-label">Bildungsregel</div>
      <div class="schema-rule">
        <span class="part-ppp">PPP</span>
        <span class="part-op">+</span>
        <span class="part-esse">esse (${isPerf ? 'Präsens' : 'Imperfekt'})</span>
      </div>
      <p class="schema-sub">esse-Formen: <strong>${esseForms}</strong></p>
      <p class="schema-sub" style="margin-top:3px">PPP richtet sich nach dem Subjekt: <em>laudatus</em> (m.) · <em>laudata</em> (f.) · <em>laudatum</em> (n.) · Pl. <em>laudati / laudatae / laudata</em></p>
    </div>`;
}

/* ── SHARED: VIEW TABLE ── */
function viewTableHTML() {
  const rows = getRows();
  return `<table class="verb-table">
    <caption>laudare — ${temp} (m.)</caption>
    <thead><tr><th>Person</th><th>PPP (m.)</th><th>esse</th><th>vollständig</th></tr></thead>
    <tbody>${rows.map(r => `<tr>
      <td>${r[0]}</td>
      <td class="ppp-cell">${r[1]}</td>
      <td class="esse-cell">${r[2]}</td>
      <td class="full-cell">${r[1]} ${r[2]}</td>
    </tr>`).join('')}</tbody>
  </table>`;
}

/* ── STUFE 1: VIEW ── */
function renderView(c) {
  c.innerHTML = `
    <div class="task-box">
      <div class="task-label">Stufe 1 — Formen kennenlernen</div>
      <p class="task-text">Hier siehst du das <strong>${temp}</strong> am Beispiel von <em>laudare</em>.
      Die <strong style="color:var(--gold)">esse-Form</strong> ist der variable Teil – präge sie dir gut ein!</p>
    </div>
    ${schemaHTML()}
    ${viewTableHTML()}
    <div class="verb-actions">
      <button class="vbtn vbtn-gold" onclick="doneMap[doneKey()]=true; buildStufen(); setStufe(2)">
        Weiter zu Stufe 2 →
      </button>
    </div>`;
}

/* ── STUFE 2: COUNTDOWN → DRAG ── */
function renderCountdownThenDrag(c) {
  c.innerHTML = `
    <div class="task-box">
      <div class="task-label">Stufe 2 — Einprägen &amp; zuordnen</div>
      <p class="task-text">Du hast <strong>10 Sekunden</strong>, um dir die esse-Formen einzuprägen. Danach ordnest du sie per <strong>Drag &amp; Drop</strong> zu.</p>
    </div>
    <div class="timer-wrap">
      <div class="timer-label"><span>Noch Zeit zum Einprägen …</span><span id="tsec">10</span></div>
      <div class="timer-track"><div class="timer-fill" id="tfill"></div></div>
    </div>
    ${schemaHTML()}
    ${viewTableHTML()}`;
  startTimer(10, () => renderDrag(c, true));
}

/* ── STUFE 4: COUNTDOWN → INPUT ── */
function renderCountdownThenInput(c) {
  c.innerHTML = `
    <div class="task-box">
      <div class="task-label">Stufe 4 — Einprägen &amp; eintippen</div>
      <p class="task-text">Du hast <strong>10 Sekunden</strong>, um dir die Formen ein letztes Mal anzusehen. Danach tippst du die esse-Formen selbst ein.</p>
    </div>
    <div class="timer-wrap">
      <div class="timer-label"><span>Noch Zeit zum Einprägen …</span><span id="tsec">10</span></div>
      <div class="timer-track"><div class="timer-fill" id="tfill"></div></div>
    </div>
    ${schemaHTML()}
    ${viewTableHTML()}`;
  startTimer(10, () => renderInput(c, true));
}

/* ── DRAG AND DROP ── */
function renderDrag(c, fromCountdown) {
  const rows = getRows();
  const correct = rows.map(r => r[2]);
  let pool = [...correct];
  const fakes = getFakes();
  let fi = 0;
  while (pool.length < correct.length + 4 && fi < fakes.length) {
    if (!pool.includes(fakes[fi])) pool.push(fakes[fi]);
    fi++;
  }
  pool = shuffle(pool);
  dropZoneData = {};

  const chips = pool.map((f, i) =>
    `<div class="drag-chip" draggable="true" data-form="${f}" id="chip_${i}">${f}</div>`
  ).join('');
  const dropRows = rows.map((r, i) => `
    <tr>
      <td>${r[0]}</td>
      <td class="ppp-col">${r[1]}</td>
      <td><div class="drop-zone" id="dz_${i}" data-index="${i}">—</div></td>
    </tr>`).join('');
  const repeatBtn = fromCountdown
    ? `<button class="vbtn vbtn-red" onclick="renderCountdownThenDrag(document.getElementById('content'))">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 .49-3.51"></path></svg>
        Nochmal anschauen
      </button>` : '';
  const stufeLbl = fromCountdown ? 2 : 3;
  const stufeDesc = fromCountdown ? 'Ziehe die richtige esse-Form in die passende Zeile.' : 'Ohne Vorlage: Ziehe die esse-Formen in die richtigen Zeilen.';

  c.innerHTML = `
    <div class="task-box">
      <div class="task-label">Stufe ${stufeLbl} — esse-Formen zuordnen</div>
      <p class="task-text">${stufeDesc} Achte auf <strong>Person &amp; Numerus</strong>!</p>
    </div>
    <div class="drag-pool" id="dragPool">${chips}</div>
    <table class="drop-table">
      <thead><tr><th>Person</th><th>PPP (m.)</th><th>esse-Form</th></tr></thead>
      <tbody>${dropRows}</tbody>
    </table>
    <div class="verb-actions">
      <button class="vbtn vbtn-primary" onclick="checkDrag()">Auswerten</button>
      <button class="vbtn vbtn-ghost" onclick="renderDrag(document.getElementById('content'), ${fromCountdown})">Zurücksetzen</button>
      ${repeatBtn}
    </div>
    <div id="feedbackBar"></div>`;
  setupDragEvents();
}

function setupDragEvents() {
  document.querySelectorAll('.drag-chip').forEach(chip => {
    chip.addEventListener('dragstart', e => {
      draggedChip = chip;
      chip.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    chip.addEventListener('dragend', () => { draggedChip = null; chip.classList.remove('dragging'); });
  });
  document.querySelectorAll('.drop-zone').forEach(zone => {
    zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('over'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('over'));
    zone.addEventListener('drop', e => {
      e.preventDefault();
      zone.classList.remove('over');
      if (!draggedChip) return;
      const idx = parseInt(zone.dataset.index);
      const form = draggedChip.dataset.form;
      if (dropZoneData[idx]) {
        const prevChip = document.querySelector(`.drag-chip[data-form="${dropZoneData[idx]}"]`);
        if (prevChip) document.getElementById('dragPool').appendChild(prevChip);
      }
      dropZoneData[idx] = form;
      zone.textContent = form;
      zone.classList.add('filled');
      draggedChip.remove();
    });
  });
  const pool = document.getElementById('dragPool');
  pool.addEventListener('dragover', e => e.preventDefault());
  pool.addEventListener('drop', e => {
    e.preventDefault();
    if (!draggedChip) return;
    const idx = Object.keys(dropZoneData).find(k => dropZoneData[k] === draggedChip.dataset.form);
    if (idx !== undefined) {
      delete dropZoneData[idx];
      const zone = document.getElementById('dz_' + idx);
      if (zone) { zone.textContent = '—'; zone.classList.remove('filled'); }
    }
    pool.appendChild(draggedChip);
  });
}

function checkDrag() {
  const rows = getRows();
  let correct = 0;
  rows.forEach((r, i) => {
    const zone = document.getElementById('dz_' + i);
    if (!zone) return;
    const ok = dropZoneData[i] === r[2];
    zone.classList.toggle('correct', ok);
    zone.classList.toggle('wrong', !ok);
    if (ok) correct++;
  });
  showFeedback(correct, rows.length);
  if (correct === rows.length) markDone();
}

/* ── INPUT MODE ── */
function renderInput(c, fromCountdown) {
  const rows = getRows();
  const inputRows = rows.map((r, i) => `
    <tr>
      <td>${r[0]}</td>
      <td class="ppp-col">${r[1]}</td>
      <td>
        <input type="text" id="inp_${i}" placeholder="esse …"
               autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="off">
      </td>
      <td><span class="hint" id="hint_${i}"></span></td>
    </tr>`).join('');
  const repeatBtn = fromCountdown
    ? `<button class="vbtn vbtn-red" onclick="renderCountdownThenInput(document.getElementById('content'))">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 .49-3.51"></path></svg>
        Nochmal anschauen
      </button>` : '';
  const stufeLbl = fromCountdown ? 4 : 5;
  const stufeDesc = fromCountdown
    ? 'Tippe jetzt die esse-Form für jede Person ein.'
    : 'Ganz ohne Spickzettel: Tippe alle esse-Formen aus dem Gedächtnis.';

  c.innerHTML = `
    <div class="task-box">
      <div class="task-label">Stufe ${stufeLbl} — esse-Formen eintippen</div>
      <p class="task-text">${stufeDesc} Mit <strong>Enter</strong> springst du zur nächsten Zeile.</p>
    </div>
    <table class="input-table">
      <thead><tr><th>Person</th><th>PPP (m.)</th><th>esse-Form</th><th></th></tr></thead>
      <tbody>${inputRows}</tbody>
    </table>
    <div class="verb-actions">
      <button class="vbtn vbtn-primary" onclick="checkInput()">Auswerten</button>
      <button class="vbtn vbtn-ghost" onclick="renderInput(document.getElementById('content'), ${fromCountdown})">Zurücksetzen</button>
      ${repeatBtn}
    </div>
    <div id="feedbackBar"></div>`;
  document.getElementById('inp_0').focus();
  rows.forEach((_, i) => {
    document.getElementById('inp_' + i).addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const next = document.getElementById('inp_' + (i + 1));
        if (next) next.focus(); else checkInput();
      }
    });
  });
}

function checkInput() {
  const rows = getRows();
  let correct = 0;
  rows.forEach((r, i) => {
    const inp  = document.getElementById('inp_' + i);
    const hint = document.getElementById('hint_' + i);
    if (!inp) return;
    const val = inp.value.trim().toLowerCase();
    const ok = val === r[2].toLowerCase();
    inp.classList.toggle('correct', ok);
    inp.classList.toggle('wrong', !ok);
    if (hint) hint.textContent = ok ? '' : '→ ' + r[2];
    if (ok) correct++;
  });
  showFeedback(correct, rows.length);
  if (correct === rows.length) markDone();
}

/* ── FEEDBACK ── */
function showFeedback(correct, total) {
  const bar = document.getElementById('feedbackBar');
  if (!bar) return;
  if (correct === total) {
    bar.innerHTML = `<div class="verb-feedback ok">✓ Alle ${total} Formen richtig! <span class="verb-score">${total}/${total}</span></div>`;
  } else {
    bar.innerHTML = `<div class="verb-feedback err">✗ ${correct} von ${total} richtig — markierte Formen prüfen <span class="verb-score">${correct}/${total}</span></div>`;
  }
}

/* ── MARK DONE + WIN ── */
function markDone() {
  doneMap[doneKey()] = true;
  buildStufen();
  buildTabs();
  const allStufen = [1,2,3,4,5].every(s => doneMap[temp + "_" + s]);
  if (allStufen) {
    setTimeout(() => { showWin(); startConfetti(); }, 600);
    return;
  }
  if (stufe < 5) {
    const actions = document.querySelector('.verb-actions');
    if (actions && !document.getElementById('nextBtn')) {
      const nb = document.createElement('button');
      nb.className = 'vbtn vbtn-gold'; nb.id = 'nextBtn';
      nb.textContent = 'Weiter zu Stufe ' + (stufe + 1) + ' →';
      nb.onclick = () => setStufe(stufe + 1);
      actions.appendChild(nb);
    }
  }
}

function showWin() {
  const other = TEMPORA.find(t => t !== temp && !isTempDone(t));
  document.getElementById('content').innerHTML = `
    <div class="win-screen">
      <div class="win-stars">★ ★ ★</div>
      <h2>Optime!</h2>
      <p>Du hast das <em>${temp}</em> auf allen fünf Stufen gemeistert!</p>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        ${other ? `<button class="vbtn vbtn-gold" onclick="setTemp('${other}')">Weiter: ${other} →</button>` : ''}
        ${isAllDone() ? `<p style="color:var(--green);font-weight:600;font-family:'DM Mono',monospace;font-size:0.85rem;margin:0">Beide Tempora abgeschlossen!</p>` : ''}
        <button class="vbtn vbtn-ghost" onclick="setStufe(1)">Nochmals üben</button>
      </div>
    </div>`;
}

/* ── TIMER ── */
function startTimer(secs, cb) {
  clearTimer();
  let elapsed = 0;
  const total = secs * 10;
  timerInterval = setInterval(() => {
    elapsed++;
    const pct  = Math.max(0, 100 - (elapsed / total) * 100);
    const fill = document.getElementById('tfill');
    const sec  = document.getElementById('tsec');
    if (fill) fill.style.width = pct + '%';
    if (sec)  sec.textContent  = Math.ceil((total - elapsed) / 10);
    if (elapsed >= total) { clearTimer(); cb(); }
  }, 100);
}
function clearTimer() { if (timerInterval) { clearInterval(timerInterval); timerInterval = null; } }

/* ── CONFETTI ── */
function startConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  const COLORS = ['#c49a2a','#e8c55a','#2a6640','#9b2a1a','#3a86ff','#a89060','#f4c842'];
  const pieces = Array.from({length: 130}, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height - canvas.height,
    w: 8 + Math.random() * 8, h: 4 + Math.random() * 5,
    angle: Math.random() * Math.PI * 2, spin: (Math.random() - 0.5) * 0.2,
    vy: 2 + Math.random() * 3, vx: (Math.random() - 0.5) * 2,
    color: COLORS[Math.floor(Math.random() * COLORS.length)], alpha: 1
  }));
  let frame = 0;
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let alive = false;
    pieces.forEach(p => {
      p.y += p.vy; p.x += p.vx; p.angle += p.spin;
      if (frame > 120) p.alpha = Math.max(0, p.alpha - 0.012);
      if (p.alpha > 0 && p.y < canvas.height + 20) alive = true;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.angle);
      ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });
    frame++;
    if (alive) requestAnimationFrame(draw);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  draw();
}

/* ── INIT ── */
buildTabs(); buildStufen(); render();
</script>
